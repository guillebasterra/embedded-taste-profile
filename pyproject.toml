[project]
name = "taste"
version = "0.1.0"
description = "Turn Pinterest boards into a portable visual taste profile that any AI agent can query."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pillow>=10",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tomli-w>=1.0",
    "mcp>=1.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Real embedding model. Not needed for tests (they use the fake embedder).
ml = ["torch>=2.3", "transformers>=4.49", "sentencepiece>=0.2", "protobuf>=4"]

[project.scripts]
taste = "taste.cli:app"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taste"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
